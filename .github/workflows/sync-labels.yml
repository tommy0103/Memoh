name: Sync labels
on:
  push:
    branches: [main]
    paths: ['.github/labels.json', '.github/scripts/sync-labels.mjs', '.github/workflows/sync-labels.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: sync-labels
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'felinics/Memoh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const { sync } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync-labels.mjs`);
            await sync(github, context.repo);
