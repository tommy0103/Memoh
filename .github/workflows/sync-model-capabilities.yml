name: Sync model capabilities

# Refreshes the reasoning capabilities (thinking_mode + reasoning_efforts) in the
# first-party conf/providers templates from the LiteLLM registry. This runs at
# build time only; the server never fetches LiteLLM at runtime. The resulting PR
# diff is plain YAML, so it is reviewed like any other template change.
on:
  schedule:
    # Weekly, Mondays 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enrich provider templates from LiteLLM
        run: go run ./cmd/synccaps

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-model-capabilities
          base: main
          title: "chore: sync model reasoning capabilities from LiteLLM"
          body: |
            ## Author
            - [x] Agent
            - [ ] Human

            ## Type
            - [ ] bug
            - [x] feat
            - [ ] test

            ## Summary
            Refresh thinking_mode and reasoning_efforts in provider templates and remove third-party reseller entries.

            ## Validation
            Ran go run ./cmd/synccaps to generate the changes. Live provider calls have not been verified.

            ## Screenshots / Recordings
            This only updates provider capability configuration and has no visible UI change. Use the generated diff and CI results for verification.

            ## Human QA
            - [ ] Human QA passed

          commit-message: "chore: sync model reasoning capabilities from LiteLLM"
          add-paths: conf/providers/*.yaml
          delete-branch: true
