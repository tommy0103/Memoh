name: Contribution format compatibility
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: Contribution format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Support older PRs that still reference this workflow; the default-branch entry point no longer blocks code CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const { gate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contribution-governance.mjs`);
            await gate({ github, context, core });
