name: Contribution governance

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [ESLint, Go CI, Rust CI, Remote Runtime CI, Migrations, Installer CI, Electron CI, Docker PR, Contribution policy CI]
    types: [requested, completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to reconcile; leave empty for new open PRs'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
  actions: write

# Coalesce events for the same item, without dropping unrelated issue/PR events.
concurrency:
  group: contribution-governance-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event_name }}
  cancel-in-progress: false

jobs:
  govern:
    if: github.repository == 'felinics/Memoh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contribution-governance.mjs`);
            await run({ github, context, core });
