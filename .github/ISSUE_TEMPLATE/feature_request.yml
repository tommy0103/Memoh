---
name: Feature Request
description: Suggest a feature or improvement
title: "[Feature]: "
labels:
- feat
body:
- type: dropdown
  id: author
  attributes:
    label: Author
    description: Declare whether this contribution was written by a human or an agent.
    options:
    - Human
    - Agent
  validations:
    required: true
- type: dropdown
  id: type
  attributes:
    label: Type
    options:
    - feat
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Feature Description
  validations:
    required: true
- type: textarea
  id: motivation
  attributes:
    label: Use Case and Motivation
  validations:
    required: true
- type: textarea
  id: solution
  attributes:
    label: Proposed Solution
  validations:
    required: false
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives Considered
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: Screenshots / Recordings
    description: Drag or paste screenshots here. Agents should attach screenshots or explain why they are unavailable or not applicable, with alternative verification.
  validations:
    required: false
- type: textarea
  id: additional
  attributes:
    label: Additional Context
  validations:
    required: false
