---
name: Help
description: Get help with installation, configuration, or usage
title: "[Help]: "
labels:
- help
body:
- type: dropdown
  id: author
  attributes:
    label: Author
    description: Declare whether this contribution was written by a human or an agent.
    options:
    - Human
    - Agent
  validations:
    required: true
- type: dropdown
  id: type
  attributes:
    label: Type
    options:
    - help
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Problem
  validations:
    required: true
- type: textarea
  id: goal
  attributes:
    label: Desired Outcome
  validations:
    required: true
- type: textarea
  id: attempts
  attributes:
    label: What You Have Tried
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Version and Environment
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Logs
    description: Paste relevant error logs and remove tokens or other sensitive information.
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: Screenshots / Recordings
    description: Drag or paste screenshots here. Agents should attach screenshots or explain why they are unavailable or not applicable, with alternative verification.
  validations:
    required: false
- type: textarea
  id: additional
  attributes:
    label: Additional Context
  validations:
    required: false
