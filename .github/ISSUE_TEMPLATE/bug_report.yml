---
name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels:
- bug
body:
- type: dropdown
  id: author
  attributes:
    label: Author
    description: Declare whether this contribution was written by a human or an agent.
    options:
    - Human
    - Agent
  validations:
    required: true
- type: dropdown
  id: type
  attributes:
    label: Type
    options:
    - bug
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Bug Description
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to Reproduce
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected and Actual Behavior
  validations:
    required: true
- type: textarea
  id: version
  attributes:
    label: Version
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
  validations:
    required: false
- type: textarea
  id: model
  attributes:
    label: Model Used
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: Logs
    description: Paste relevant error logs and remove tokens or other sensitive information.
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: Screenshots / Recordings
    description: Drag or paste screenshots here. Agents should attach screenshots or explain why they are unavailable or not applicable, with alternative verification.
  validations:
    required: false
- type: textarea
  id: additional
  attributes:
    label: Additional Context
  validations:
    required: false
